seed: 42

data:
  profiles: ../data/raw/author_with_aminer_candidates.json
  author2paper: ../data/raw/AMiner-Author2Paper.txt
  papers: ../data/raw/AMiner-Paper.txt
  graph: ../data/processed/sch.json

build:
  author_resolution: best_org
  max_scholars: 6119
  max_papers: 18092
  topics_per_scholar: 5
  train_fraction: 0.70
  validation_fraction: 0.15

model:
  embedding_dim: 128
  layers: 2
  learning_rate: 0.001
  batch_size: 512
  margin: 1.0
  max_epochs: 150
  early_stopping_patience: 10
  evaluation_k: [10, 20, 50]
  device: cuda

checkpoint: ../saved_model.pt
output_dir: ../outputs
