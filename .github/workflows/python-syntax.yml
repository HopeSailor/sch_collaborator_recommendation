name: Python syntax
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile project modules
        run: python -m compileall -q data model explain train.py evaluate.py utils.py
